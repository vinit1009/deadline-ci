name: Deadline CI
description: Fail the build when a QNX kernel trace misses a declared timing budget (latency, round trip, jitter, CPU share).
branding:
  icon: clock
  color: red
inputs:
  trace:
    description: Path to traceprinter output (text) from the scenario run.
    required: true
  budgets:
    description: Path to the budgets file.
    default: deadlines.toml
  junit:
    description: Where to write the JUnit XML report.
    default: deadline-report.xml
  svg:
    description: Where to write the SVG timeline of the worst violation.
    default: deadline-worst.svg
  python-version:
    description: Python used to run the checker (3.11 or newer).
    default: "3.12"
outputs:
  passed:
    description: "'true' when every budget was met."
    value: ${{ steps.check.outputs.passed }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Deadline CI
      shell: bash
      run: python -m pip install --quiet "$GITHUB_ACTION_PATH"
    - name: Check the trace against the budgets
      id: check
      shell: bash
      env:
        TRACE: ${{ inputs.trace }}
        BUDGETS: ${{ inputs.budgets }}
        JUNIT: ${{ inputs.junit }}
        SVG: ${{ inputs.svg }}
      run: |
        set +e
        deadline check "$TRACE" --budgets "$BUDGETS" --junit "$JUNIT" --svg "$SVG"
        code=$?
        if [ "$code" -eq 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi
        exit "$code"
