# Timing budgets for the demo scenario (scenario/run-scenario.sh on QNX OS 8.0).
# Thread selectors come from `deadline threads trace.txt`. Limits were checked against a healthy run
# with `deadline baseline`; under QEMU emulation, keep generous headroom.

[[budget]]
name = "Control loop wakes up within 150 us of its 1 ms timer pulse"
type = "latency"
thread = { process = "deadline-demo", tid = 2 }
from_state = "THRECEIVE"      # blocked in MsgReceivePulse() until the timer pulse arrives
percentile = 99
max_us = 150

[[budget]]
name = "Clock interrupt to control loop running within 200 us"
type = "chain"
thread = { process = "deadline-demo", tid = 2 }
from_state = "THRECEIVE"
# The kernel events that wake the loop each tick, in order: the clock interrupt, the loop's timer
# firing, its pulse. A miss is reported stage by stage, down to ready -> running.
stages = ["INTERRUPT:INT_DELIVER intr_id=0x80010000", "SYSTEM:TIMER", "COMM:SND_PULSE_EXE"]
percentile = 99
max_us = 200

[[budget]]
name = "Client request round trip under 400 us"
type = "roundtrip"
thread = { process = "deadline-client", tid = 1 }
call = "MSG_SENDV"            # MsgSend(): from the kernel call to its return, including the server's work
percentile = 99.9
max_us = 400

[[budget]]
name = "Control loop period stays within 200 us of 1 ms"
type = "jitter"
thread = { process = "deadline-demo", tid = 2 }
from_state = "THRECEIVE"
period_us = 1000
tolerance_us = 200
percentile = 99

[[budget]]
name = "AI worker uses at most 40% of the CPU"
type = "cpu"
process = "ai-worker"
window_ms = 100
max_share = 0.40
percentile = 100
