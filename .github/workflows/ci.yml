name: tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: PYTHONPATH=.:tests python -m unittest discover -s tests
  action:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: PYTHONPATH=tests python3 tests/make_examples.py demo
      - name: A healthy run passes
        uses: ./
        with:
          trace: demo/healthy.txt
          budgets: demo/deadlines.toml
          junit: demo/healthy.xml
          svg: demo/healthy.svg
      - name: A regressed run fails
        id: regressed
        continue-on-error: true
        uses: ./
        with:
          trace: demo/regressed.txt
          budgets: demo/deadlines.toml
          junit: demo/regressed.xml
          svg: demo/regressed.svg
      - name: The regression was caught
        if: steps.regressed.outputs.passed != 'false'
        run: exit 1
      - name: A real QNX OS 8.0 trace (healthy run) passes
        uses: ./
        with:
          trace: examples/qnx-qemu/healthy.txt.gz
          budgets: scenario/deadlines.toml
          junit: demo/qnx-healthy.xml
          svg: demo/qnx-healthy.svg
      - name: A real QNX OS 8.0 trace (regressed run) fails
        id: qnx_regressed
        continue-on-error: true
        uses: ./
        with:
          trace: examples/qnx-qemu/regressed.txt.gz
          budgets: scenario/deadlines.toml
          junit: demo/qnx-regressed.xml
          svg: demo/qnx-regressed.svg
      - name: The real regression was caught
        if: steps.qnx_regressed.outputs.passed != 'false'
        run: exit 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deadline-reports
          path: demo/
