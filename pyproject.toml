[project]
name = "deadline-ci"
version = "0.2.0"
description = "Turn QNX kernel traces into pass/fail timing tests for CI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
deadline = "deadline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["deadline"]
